<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300">
<defs>
  <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#7dcfff"/><stop offset=".5" stop-color="#7aa2f7"/><stop offset="1" stop-color="#bb9af7"/>
  </linearGradient>
  <linearGradient id="gh" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#7dcfff"/><stop offset=".5" stop-color="#7aa2f7"/><stop offset="1" stop-color="#bb9af7"/>
  </linearGradient>
  <filter id="glow" x="-10%" y="-30%" width="120%" height="160%">
    <feGaussianBlur stdDeviation="4" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <style>
    text { font-family: Consolas,'JetBrains Mono','DejaVu Sans Mono','Courier New',monospace; }
    .k { fill: #7dcfff; } .v { fill: #c0caf5; } .d { fill: #565f89; } .p { fill: #bb9af7; }
    .gr { fill: #9ece6a; } .y { fill: #e0af68; } .b { fill: #7aa2f7; }
    .bold { font-weight: 700; }
    .cur { animation: blink 1.1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    .led { animation: led 1.6s ease-in-out infinite; }
    @keyframes led { 0%,100% { opacity: 1; } 50% { opacity: .35; } }
    
  </style>
</defs>

<rect width="1000" height="300" rx="20" fill="#0b0e17"/>
<rect x="6" y="6" width="988" height="288" rx="16" fill="#11141f" stroke="url(#g)" stroke-width="2" filter="url(#glow)"/>

<text x="30" y="44" font-size="13" class="d" xml:space="preserve">Codes: C - connected (now), O - OSPF (learning), S - static (next)</text>
<line x1="30" y1="60" x2="970" y2="60" stroke="#565f89" stroke-opacity=".35"/>
<text x="30" y="92" font-size="16" xml:space="preserve"><tspan fill="#7dcfff" class="bold">C</tspan><tspan class="d">   10.0.1.0/24   via   </tspan><tspan fill="#7dcfff" class="bold">Networking        </tspan><tspan class="v"> routing, switching, automation with Python</tspan></text>
<text x="30" y="130" font-size="16" xml:space="preserve"><tspan fill="#7aa2f7" class="bold">C</tspan><tspan class="d">   10.0.2.0/24   via   </tspan><tspan fill="#7aa2f7" class="bold">Operating Systems </tspan><tspan class="v"> kernel internals, memory, scheduling</tspan></text>
<text x="30" y="168" font-size="16" xml:space="preserve"><tspan fill="#bb9af7" class="bold">O</tspan><tspan class="d">   10.0.3.0/24   via   </tspan><tspan fill="#bb9af7" class="bold">Cybersecurity     </tspan><tspan class="v"> network security, secure coding</tspan></text>
<text x="30" y="206" font-size="16" xml:space="preserve"><tspan fill="#e0af68" class="bold">O</tspan><tspan class="d">   10.0.4.0/24   via   </tspan><tspan fill="#e0af68" class="bold">Automotive        </tspan><tspan class="v"> ECUs, RTOS, in-vehicle networks</tspan></text>
<text x="30" y="244" font-size="16" xml:space="preserve"><tspan fill="#9ece6a" class="bold">S</tspan><tspan class="d">   10.0.5.0/24   via   </tspan><tspan fill="#9ece6a" class="bold">Edge AI           </tspan><tspan class="v"> small ML models on constrained hardware</tspan></text>
<text x="30" y="276" font-size="14" xml:space="preserve"><tspan class="p bold">R1-UPT</tspan><tspan class="d">#</tspan> <tspan class="cur gr">█</tspan></text>
</svg>